name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build, test and verify formatting

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FinOpsDesk.slnx

      - name: Verify formatting
        run: dotnet format FinOpsDesk.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build FinOpsDesk.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test FinOpsDesk.slnx --configuration Release --no-build --no-restore